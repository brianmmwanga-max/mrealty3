<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Register — Listings | M Realty</title>
  <meta name="description" content="Search the M Realty register: apartments, villas, townhouses and penthouses across Nairobi, filterable by price, location, bedrooms and status." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1c3a'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' fill='%23c5a059' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <section class="page-hero">
    <div class="wrap">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a> / Listings</nav>
      <p class="eyebrow">The Register</p>
      <h1 class="display" style="margin-top:16px">Every asset we currently hold.</h1>
      <p class="lede">Sold and off-plan records are retained for comparables. Filter by specification,
        sort by recency or value, and switch between grid and list reading modes.</p>
    </div>
  </section>

  <section class="section--tight section" style="padding-top:48px">
    <div class="wrap">

      <!-- Filter bar -->
      <div class="filter-bar" role="search" aria-label="Filter listings">
        <div class="field field--noarrow">
          <label for="f-q">Keyword</label>
          <input type="text" id="f-q" placeholder="e.g. penthouse, Park Lane…" />
        </div>
        <div class="field field--noarrow select-shell">
          <label for="f-location">Location</label>
          <select id="f-location"></select>
        </div>
        <div class="field field--noarrow select-shell">
          <label for="f-type">Type</label>
          <select id="f-type">
            <option value="">All Types</option>
            <option>Apartment</option><option>Villa</option>
            <option>Townhouse</option><option>Penthouse</option>
          </select>
        </div>
        <div class="field field--noarrow select-shell">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="">Any Status</option>
            <option>For Sale</option><option>Off-Plan</option><option>Sold</option>
          </select>
        </div>
        <div class="field field--noarrow select-shell">
          <label for="f-beds">Bedrooms</label>
          <select id="f-beds">
            <option value="">Any</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5">5+</option>
          </select>
        </div>
        <div class="field field--noarrow select-shell">
          <label for="f-baths">Bathrooms</label>
          <select id="f-baths">
            <option value="">Any</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4+</option>
          </select>
        </div>
        <div class="field field--noarrow range-field" style="grid-column: span 2;">
          <label for="f-max">Maximum Price — <output id="f-max-out">No limit</output></label>
          <input type="range" id="f-max" min="5000000" max="100000000" step="1000000" value="100000000" />
        </div>
        <div class="filter-bar__actions">
          <button class="btn btn--navy" type="button" onclick="document.getElementById('property-grid').scrollIntoView({behavior:'smooth'})">Apply</button>
          <button class="filter-reset" type="button" id="filter-reset">Reset all</button>
        </div>
      </div>

      <div class="chip-row" id="active-chips"></div>

      <!-- Toolbar: count + sort + view toggle -->
      <div class="listings-toolbar">
        <div class="listings-toolbar__left">
          <span class="result-count" id="result-count">Loading register…</span>
        </div>
        <div class="toolbar-controls">
          <label class="serif-num" for="sort">Sort</label>
          <select class="sort-select" id="sort">
            <option value="newest">Newest First</option>
            <option value="price-desc">Price — High to Low</option>
            <option value="price-asc">Price — Low to High</option>
          </select>
          <div class="view-toggle" role="group" aria-label="View mode">
            <button data-view="grid" class="is-active" aria-label="Grid view">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            </button>
            <button data-view="list" aria-label="List view">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="5"/><rect x="3" y="14" width="18" height="5"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Results grid (injected) -->
      <div class="property-grid" id="property-grid" aria-live="polite"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/listings.js"></script>
  <script>MRShared.mount("listings");</script>
</body>
</html>
